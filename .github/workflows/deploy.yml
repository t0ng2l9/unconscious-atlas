name: Deploy to Cloudflare Pages

# Every push to main builds the site and publishes dist/ to the existing
# `unconscious-atlas` Pages project. Replaces manual drag-and-drop uploads.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # wrangler is installed with npm on purpose: wrangler-action defaults to
      # pnpm here, which collides with the pnpm set up above (the action then
      # fails with `process .../setup-pnpm/node_modules/.bin/pnpm` exit 1).
      - name: Install wrangler
        run: npm install --no-save wrangler@latest

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=unconscious-atlas --branch=main
